openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /staff/access:
    get:
      operationId: getStaffAccess
      tags: [staff]
      summary: Read full department access for the signed-in City Staff account
      responses:
        "200":
          description: Reviewer department and effective department access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAccess" }
        "401":
          description: Sign in required
        "403":
          description: Select City Staff and enroll the signed-in account before reading staff access
        "503":
          description: Staff access service is temporarily unavailable
    post:
      operationId: enterStaffWorkspace
      tags: [staff]
      summary: Grant City Staff access to the authenticated account that selected the staff workspace
      description: The server verifies the signed-in identity, assigns any missing staff metadata to that account, and returns access to every department. No account ID or department is accepted from the browser.
      responses:
        "200":
          description: City Staff access for the authenticated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAccess" }
        "400":
          description: Enrollment does not accept a user ID or department
        "401":
          description: Sign in required
        "403":
          description: Origin must match the current signed-in site
        "503":
          description: Staff access service is temporarily unavailable
  /workspace/prototype-sources:
    get:
      operationId: listWorkspacePrototypeSources
      tags: [workspace]
      responses:
        "200":
          description: Fictional, versioned permit-reference documents for the prototype; not City publications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspacePrototypeSource" }
  /workspace/records:
    get:
      operationId: listWorkspaceRecords
      tags: [workspace]
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: mode, schema: { type: string, enum: [research, live] } }
      responses:
        "200":
          description: PII-free synthetic demonstration records and public permit metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceRecord" }
  /workspace/escalations:
    get:
      operationId: listWorkspaceEscalations
      tags: [workspace]
      responses:
        "200":
          description: Authorized staff review queue for safety-flagged workspace items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceEscalation" }
  /workspace/escalations/{id}/acknowledge:
    post:
      operationId: acknowledgeWorkspaceEscalation
      tags: [workspace]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Item acknowledged in the protected prototype queue, not proof of email delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceEscalation" }
  /workspace/conversations:
    get:
      operationId: listWorkspaceConversations
      tags: [workspace]
      responses:
        "200":
          description: Current user's conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceConversation" }
    post:
      operationId: createWorkspaceConversation
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceConversationInput" }
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceConversation" }
  /workspace/conversations/{id}:
    delete:
      operationId: deleteWorkspaceConversation
      tags: [workspace]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Conversation and its messages were permanently deleted
        "404":
          description: Conversation not found
  /workspace/conversations/{id}/messages:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listWorkspaceMessages
      tags: [workspace]
      responses:
        "200":
          description: Messages in a conversation owned by this user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceMessage" }
    post:
      operationId: sendWorkspaceMessage
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceMessageInput" }
      responses:
        "201":
          description: Persisted assistant response and tool safety metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceReply" }
        "400":
          description: Invalid question or blocked unsafe request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRequestError" }
        "401":
          description: Sign-in is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRequestError" }
        "404":
          description: Conversation is missing or not owned by this user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRequestError" }
        "429":
          description: Workspace or AI provider rate limit; honor Retry-After
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRequestError" }
        "502":
          description: AI provider rejected the configuration or returned no answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRequestError" }
        "503":
          description: AI configuration, provider access, or storage is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRequestError" }
        "504":
          description: AI response timed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRequestError" }
  /applications/{id}/history:
    get:
      operationId: listApplicationHistory
      tags: [applications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Status changes for the owner or an authorized staff member
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusEvent" }
  /applications/{id}/documents:
    get:
      operationId: listApplicationDocuments
      tags: [applications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Documents available to the owner or authorized staff assigned to this submitted application
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationDocument" }
        "503":
          description: A ready document's immutable final storage generation could not be verified; no document list is returned and the request may be retried
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /applications/{id}/documents/upload-url:
    post:
      operationId: requestApplicationDocumentUpload
      tags: [applications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationDocumentInput" }
      responses:
        "201":
          description: Short-lived upload URL and reserved document metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDocumentUpload" }
  /applications/{id}/documents/{documentId}/complete:
    post:
      operationId: completeApplicationDocumentUpload
      tags: [applications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: documentId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Verified, ready document metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDocument" }
  /applications/{id}/documents/{documentId}:
    delete:
      operationId: deleteApplicationDocument
      tags: [applications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: documentId, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Document and private object deleted
  /applications/{id}/documents/{documentId}/content:
    get:
      operationId: downloadApplicationDocument
      tags: [applications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: documentId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: download, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Protected document content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /applications/{id}/response:
    post:
      operationId: postApplicationResponse
      tags: [applications]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationResponseInput" }
      responses:
        "200":
          description: Staff response posted to the applicant's saved plan, with no email delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationRecord" }
  /applications/mine:
    get:
      operationId: listMyApplications
      tags: [applications]
      parameters:
        - in: query
          name: applicantKey
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Applications belonging to this signed-in account and applicant key
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationRecord" }
        "503":
          description: Application storage is temporarily unavailable
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /applications/staff:
    get:
      operationId: searchStaffApplications
      tags: [applications]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: applicationId, schema: { type: string } }
        - { in: query, name: businessName, schema: { type: string } }
        - { in: query, name: businessCategory, schema: { type: string } }
        - { in: query, name: requestType, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: assignedDepartment, schema: { type: string } }
        - { in: query, name: applicantLanguage, schema: { type: string } }
        - { in: query, name: submissionDate, schema: { type: string, format: date } }
        - { in: query, name: descriptionOrNotes, schema: { type: string } }
      responses:
        "200":
          description: "Matching submitted prototype records; sample fallback rows are marked inside plan with _dataSource: sample-fallback"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationRecord" }
        "503":
          description: Application database is unavailable and no sample applications match these filters
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /applications:
    get:
      operationId: listStaffApplications
      tags: [applications]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: applicationId, schema: { type: string } }
        - { in: query, name: businessName, schema: { type: string } }
        - { in: query, name: businessCategory, schema: { type: string } }
        - { in: query, name: requestType, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: assignedDepartment, schema: { type: string } }
        - { in: query, name: applicantLanguage, schema: { type: string } }
        - { in: query, name: submissionDate, schema: { type: string, format: date } }
        - { in: query, name: descriptionOrNotes, schema: { type: string } }
      responses:
        "200":
          description: "Matching submitted prototype records; sample fallback rows are marked inside plan with _dataSource: sample-fallback"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationRecord" }
        "503":
          description: Application database is unavailable and no sample applications match these filters
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
    post:
      operationId: createApplication
      tags: [applications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "201":
          description: Created application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationRecord" }
  /applications/{id}:
    patch:
      operationId: updateMyApplication
      tags: [applications]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "200":
          description: Updated owned application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationRecord" }
  /applications/{id}/contact:
    patch:
      operationId: updateApplicationContact
      tags: [applications]
      summary: Update contact details and notification consent for an owned application
      description: Available to the owner for genuine applications in any status, including submitted and completed. Omitted contact fields are unchanged; supplied contact strings are trimmed and validated only when changed. Name is limited to 200 characters, email to 254 characters and valid email format, and phone to 40 characters, common phone punctuation, and 7–15 digits. Unchanged legacy values are retained so consent can be withdrawn without erasing them. notificationConsent must be a boolean; true requires a valid nonempty email address or phone number. Consent only records permission for possible future application updates; no external delivery provider is configured. Sample and source records cannot be changed.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationContactInput" }
      responses:
        "200":
          description: Updated owned application; only intake contact details and consent are changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationRecord" }
        "400":
          description: Invalid contact details, consent, or applicant key
        "401":
          description: Sign in required
        "404":
          description: Application not found for this owner and applicant key
        "409":
          description: Application changed since it was last loaded, or is a sample/source record
  /applications/{id}/review:
    patch:
      operationId: reviewApplication
      tags: [applications]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationReview" }
      responses:
        "200":
          description: Updated staff review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationRecord" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    StaffAccess:
      type: object
      additionalProperties: false
      required: [administratorEnabled, assignedDepartment, accessibleDepartments]
      properties:
        administratorEnabled:
          type: boolean
          description: Always true for a server-approved City Staff account.
        assignedDepartment: { type: string, enum: [Planning, Building, Fire, Economic Development] }
        accessibleDepartments:
          type: array
          items: { type: string, enum: [Planning, Building, Fire, Economic Development] }
    WorkspaceEscalation:
      type: object
      required: [ticketId, status, departmentInbox, summary, createdAt, acknowledgedAt, acknowledgedBy, acknowledgedDepartment, deliveryStatus, testRecipient]
      properties:
        ticketId: { type: string }
        status: { type: string }
        departmentInbox: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
        acknowledgedAt: { type: ["string", "null"], format: date-time }
        acknowledgedBy: { type: ["string", "null"], description: Clerk ID of the authorized staff member who first acknowledged the ticket }
        acknowledgedDepartment: { type: ["string", "null"], description: Staff department at the time of acknowledgement }
        deliveryStatus: { type: string }
        testRecipient: { type: ["string", "null"] }
    WorkspaceRecord:
      type: object
      required: [id, category, status, department, language, description, synthetic, sourceUrl, updatedAt, sourceDate, sourceImportedAt, freshness]
      properties:
        id: { type: string }
        category: { type: string }
        status: { type: string }
        department: { type: string }
        language: { type: string }
        description: { type: string }
        synthetic: { type: boolean }
        sourceUrl: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }
        sourceDate: { type: ["string", "null"], format: date-time }
        sourceImportedAt: { type: ["string", "null"], format: date-time }
        freshness: { type: string, enum: [demo, cached, outdated] }
    WorkspacePrototypeSource:
      type: object
      required: [id, topic, title, version, revisedAt, officialReferenceUrl, content, checkedAt, state]
      properties:
        id: { type: string }
        topic: { type: string, enum: [rules, fees, status, alerts] }
        title: { type: string }
        version: { type: string }
        revisedAt: { type: string, format: date-time }
        officialReferenceUrl: { type: string, format: uri }
        content: { type: string }
        checkedAt: { type: string, format: date-time }
        state: { type: string, enum: [demo, outdated, unavailable] }
    WorkspaceConversation:
      type: object
      required: [id, title, mode, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        mode: { type: string, enum: [research, live] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceConversationInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [research, live] }
    WorkspaceMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    WorkspaceMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 3, maxLength: 2000 }
    WorkspaceRequestError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
    WorkspaceReply:
      type: object
      required: [message, sources, synthetic, escalation, securityStatus]
      properties:
        message: { $ref: "#/components/schemas/WorkspaceMessage" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceRecord" }
        synthetic: { type: boolean }
        escalation: { type: ["string", "null"] }
        securityStatus: { type: string }
    StatusEvent:
      type: object
      required: [id, applicationId, status, actor, synthetic, createdAt, updatedAt]
      properties:
        id: { type: string }
        applicationId: { type: string }
        status: { type: string }
        actor: { type: string }
        synthetic: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApplicationRecord:
      type: object
      required: [id, businessName, businessCategory, requestType, status, assignedDepartment, applicantLanguage, description, synthetic, plan, externalDeliveryStatus, createdAt, updatedAt]
      properties:
        id: { type: string }
        businessName: { type: string }
        businessCategory: { type: string }
        requestType: { type: string }
        status: { type: string }
        assignedDepartment: { type: string }
        applicantLanguage: { type: string }
        submittedAt: { type: ["string", "null"], format: date-time }
        sourceUrl: { type: ["string", "null"] }
        sourceDataset: { type: ["string", "null"] }
        sourceDate: { type: ["string", "null"], format: date-time }
        sourceImportedAt: { type: ["string", "null"], format: date-time }
        description: { type: string }
        notes: { type: ["string", "null"] }
        synthetic: { type: boolean }
        plan: { $ref: "#/components/schemas/ApplicationRecordPlan" }
        externalDeliveryStatus:
          type: string
          enum: [not_configured]
          description: Server-owned status. Always not_configured; no external notification delivery is configured.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApplicationDocument:
      type: object
      required: [id, name, size, contentType, state, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer }
        contentType: { type: string, enum: [application/pdf, image/png, image/jpeg] }
        state: { type: string, enum: [pending, ready] }
        uploadedAt: { type: ["string", "null"], format: date-time }
    ApplicationDocumentInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [application/pdf, image/png, image/jpeg] }
    ApplicationDocumentUpload:
      type: object
      required: [uploadUrl, document]
      properties:
        uploadUrl: { type: string, format: uri }
        document: { $ref: "#/components/schemas/ApplicationDocument" }
    ApplicationInput:
      type: object
      required: [applicantKey, plan]
      properties:
        applicantKey: { type: string, minLength: 1, maxLength: 200 }
        plan: { $ref: "#/components/schemas/ApplicationInputPlan" }
        expectedUpdatedAt: { type: string, format: date-time, description: Version returned by the last application read; stale writes are rejected with 409 }
    ApplicationContactInput:
      type: object
      required: [applicantKey, notificationConsent]
      properties:
        applicantKey: { type: string, minLength: 1, maxLength: 200 }
        expectedUpdatedAt: { type: string, format: date-time, description: Version returned by the last application read; stale writes are rejected with 409 }
        applicantName: { type: string, description: "Optional. When changed, trim and limit to 200 characters." }
        applicantEmail: { type: string, description: "Optional. When changed, trim, limit to 254 characters, and validate email format. An unchanged legacy value may be retained." }
        applicantPhone: { type: string, description: "Optional. When changed, trim, limit to 40 characters, use only digits, spaces, +, parentheses, periods, or hyphens, and include 7–15 digits. An unchanged legacy value may be retained." }
        notificationConsent: { type: boolean, description: "Must be a strict boolean. True requires a valid nonempty email or phone; records permission for possible future application updates only." }
    ApplicationInputPlan:
      type: object
      additionalProperties: {}
      description: "Plan supplied to create/draft writes. Intake contact strings are trimmed; name is limited to 200 characters, email to 254 characters and valid format when nonempty, phone to 40 characters and 7–15 digits using common phone punctuation when nonempty. notificationConsent defaults to false and true requires a valid nonempty email or phone."
      properties:
        intake:
          type: object
          additionalProperties: {}
          description: Intake properties remain extensible; create and draft writes use strict contact validation.
          properties:
            applicantName: { type: string, maxLength: 200 }
            applicantEmail: { type: string, maxLength: 254, pattern: '^(?:[^\s@]+@[^\s@]+\.[^\s@]+)?$' }
            applicantPhone: { type: string, maxLength: 40, pattern: "^[0-9+(). -]*$" }
            notificationConsent: { type: boolean, default: false }
    ApplicationReviewPlan:
      type: object
      additionalProperties: {}
      description: Staff review plan updates are extensible and preserve stored contact values, including legacy strings that predate strict contact validation.
      properties:
        intake:
          type: object
          additionalProperties: {}
          properties:
            applicantName: { type: string }
            applicantEmail: { type: string }
            applicantPhone: { type: string }
            notificationConsent: { type: boolean }
    ApplicationRecordPlan:
      type: object
      additionalProperties: {}
      description: "Application-specific stored plan data; sample fallback staff results include _dataSource: sample-fallback inside this object. Stored contact strings are returned permissively for compatibility with legacy values."
      properties:
        intake:
          type: object
          additionalProperties: {}
          description: Extensible stored intake. Legacy email and phone strings are returned unchanged; new writes use strict contact validation.
          properties:
            applicantName: { type: string }
            applicantEmail: { type: string }
            applicantPhone: { type: string }
            notificationConsent: { type: boolean, default: false }
    ApplicationReview:
      type: object
      required: [plan]
      properties:
        plan: { $ref: "#/components/schemas/ApplicationReviewPlan" }
        expectedUpdatedAt: { type: string, format: date-time, description: Version returned by the last application read; stale review writes are rejected with 409 }
    ApplicationResponseInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 3000 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

